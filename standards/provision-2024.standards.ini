; FD-Draft firm standards for ProVisionTemplate-2024.dwt
;
; Written from a read of the template itself (layers, blocks, text styles,
; paper-space layouts) and FD-Pro's ProVision 2024 code list, whose LINE LAYER
; values match this template's line layers one for one.
;
; Plain INI. ";" starts a comment. Code keys accept * and ? wildcards; an exact
; code always beats a pattern, otherwise the first matching line wins.
; Anything marked VERIFY is a sensible default that a drafter should confirm.

[general]
name = ProVision 2024
distance_decimals = 2
bearing_seconds_decimals = 0
; Plans on a rotated bearing reference: degrees added to every grid bearing.
bearing_rotation_deg = 0
; traverse = bearing in the direction the figure was shot; reading = as the text reads
bearing_direction = traverse
; The template's notes say distances are GROUND. Turn this on when the FD-Pro
; job holds grid coordinates (job.ini ScaleGpsToGround=false) with a real factor.
grid_to_ground = false
draw_measured_lines = false
; The template's model space holds a sample label kit and two signature blocks
; around E 321025 N 4840220. Clear it so it never lands in a finished plan
; (the block definitions stay available).
clear_template_model_space = true

[text]
; Paper millimetres. Style names in the template encode their Leroy size:
; L60 = 1.5 mm, L80 = 2.0 mm, L100 = 2.5 mm.
bearing = 2.0
distance = 2.0
arc = 2.0
point_number = 1.5
elevation = 1.5
monument = 2.0
area = 2.5
label_gap_factor = 0.5
; Fallback symbol size for codes with no block.
symbol_size = 1.5
; The template's symbol blocks are drawn so they read right at 1:100
; (manhole 0.25 m across = 2.5 mm): 1 block unit = 10 paper mm.
block_unit_mm = 10

[text-styles]
bearing = PLAN-Bearing
distance = PLAN-Distance
arc = PLAN-Distance
point_number = L60-1.5MM
elevation = L60-1.5MM
monument = L80-2.0MM
area = L100-2.5MM

[layers]
bearing = PLAN-Bearing
distance = PLAN-Distance
arc = PLAN-Distance
monument_label = PLAN-Monument-Label
area = PLAN-Other-Label
default_line = MISCELLANEOUS-LINE

[viewport]
; Defpoints never plots, so the viewport's edge will not print.
layer = Defpoints

[north-arrow]
; Drawn about 4 units tall; scale 3 gives a ~12 mm arrow body (~24 mm with the N). VERIFY size.
block = Plan-NORTH ARROW
scale = 3
offset_x = 15
offset_y = 30

[point-layers]
; {feature} = the code's LINE LAYER with dashes removed (FENCE-CHAINLINK -> FENCECHAINLINK),
; unless [feature-map] says otherwise.
symbol = MSPOINT-{feature}
number = POINTNUMBER-{feature}
elevation = ELEVATION-{feature}

[feature-map]
; LINE LAYER = feature, where the template's MSPOINT-/POINTNUMBER-/ELEVATION- names differ.
PLAN-MONUMENT = MONUMENT
PLAN-CONTROL = CONTROL
PLAN-Calculation = CALCULATION
FENCE-GENERAL = FENCE
FENCE-IRONFENCE = FENCEIRON
WATERSERVICE-WKEY = WATERSERVICEWATERKEY
WATERSERVICE-WVALVE = WATERSERVICEWATERVALVE
MISCELLANEOUS-PILLAR = POLEPILLAR
UTILITIES-PEDESTAL = UTILITIESPEDESTRAL

[line-layers]
; Linework whose code is a monument or calculated corner is property boundary.
; FDN is Foundation, not a monument - listed exactly so FD* below cannot catch it.
FDN = BUILDING-FOUNDATION
FDCA = PLAN-SubjectBoundary
FDCC = PLAN-SubjectBoundary
FDCM = PLAN-SubjectBoundary
FDCP = PLAN-SubjectBoundary
FDIB = PLAN-SubjectBoundary
FDIP = PLAN-SubjectBoundary
FDPB = PLAN-SubjectBoundary
FDRIB = PLAN-SubjectBoundary
FDSIB = PLAN-SubjectBoundary
SET* = PLAN-SubjectBoundary
CALC = PLAN-SubjectBoundary
; A dedicated boundary code, if one is added to the FD-Pro code list later:
BDY* = PLAN-SubjectBoundary

[labels]
; Figures with these codes get a bearing and distance on every course.
label_codes = FDCA,FDCC,FDCM,FDCP,FDIB,FDIP,FDPB,FDRIB,FDSIB,SET*,CALC,BDY*
; true = every FD-Pro AREA figure (buildings too) gets bearings, distances and an area.
label_area_figures = false
area_label = true
area_format = AREA = {m2} m²
point_numbers = true
point_elevations = true
elevation_format = F2
; Angles on the plan (degrees counter-clockwise from the plan's right). The elevation
; text runs along its line from the point (45 = up the 45-degree line to the right);
; the point number sits level at its angle (-45 = down-right). Both keep that on the
; plan when Surveyor View turns it.
elevation_angle = 45
point_number_angle = -45
; No elevation text for these (monuments and calc points carry none on a plan).
no_elevation_codes = FD*,SET*,CALC,BLDG-NOELEV
min_labelled_course_mm = 4
; {mon} from [monuments]; add {note} to append the FD-Pro point note, e.g. "(OU)" or "(1005)".
monument_format = {mon}

[monuments]
; VERIFY: plan abbreviations for each monument code.
FDCA = CUT
FDCC = CC
FDCM = CM
FDCP = CP
FDIB = IB
FDIP = IP
FDPB = PB
FDRIB = RIB
FDSIB = SIB
SETCC = CC
SETCP = CP
SETIB = IB
SETNL = NAIL
SETPB = PB
SETPIN = PIN
SETSIB = SIB
SETSTAKE = STAKE

[symbols]
; Code = template block. Codes not listed get a small drawn symbol from FD-Pro's own list.
FDCA = PLAN-FOUND MONUMENT
FDCC = PLAN-FOUND MONUMENT
FDCM = PLAN-FOUND MONUMENT
FDCP = PLAN-FOUND MONUMENT
FDIB = PLAN-FOUND MONUMENT
FDIP = PLAN-FOUND MONUMENT
FDPB = PLAN-FOUND MONUMENT
FDRIB = PLAN-FOUND MONUMENT
FDSIB = PLAN-FOUND MONUMENT
SET* = PLAN-SET MONUMENT
HCM = PLAN-HCM
BM = PLAN-BENCH MARK
TRAV = PLAN-CONTROL
RESECT = PLAN-CONTROL
CHK = PLAN-CONTROL
AC = TOPO-AC UNIT
BH = TOPO-BOREHOLE
BOL = TOPO-BOLLARD
BP = TOPO-BIKE POST
CB = TOPO-CATCH BASIN
DICB = TOPO-CATCH BASIN
COL = TOPO-COLUMN
CT = TOPO-CONTREE
DT = Topo-DecTree
FH = TOPO-FIRE HYDRANT
FP = TOPO-POLE FLAG
GV = TOPO-GAS VALVE
GW = TOPO-POLE ANCHOR
GM = TOPO-GAS METER
HW = TOPO-HANDWELL
ICV = TOPO-ICV
LS = TOPO-POLE LS
UPLS = TOPO-POLE LS
MBOX = TOPO-MAILBOX
MH = TOPO-MANHOLE
MHBELL = TOPO-MANHOLE BELL
MHGAS = TOPO-MANHOLE GAS
MHHYDRO = TOPO-MANHOLE HYDRO
MHWAT = TOPO-MANHOLE WATER
SAN = TOPO-MANHOLE SAN
STM = TOPO-MANHOLE STM
MW = TOPO-MONITORING WELL
PL = TOPO-POLE POST
SIGN = TOPO-SIGN
SPR = TOPO-SPRINKLER
UP = TOPO-POLE HYDRO
UPTL = TOPO-POLE TL
VENT = TOPO-VENT
WK = TOPO-WATER KEY
WV = TOPO-WATER VALVE
CBOX = TOPO-UTILITY BOX
TBOX = TOPO-UTILITY BOX
UBOX = TOPO-UTILITY BOX
SHRUB = Topo-SHRUB

[scales]
units = metric
list = 100,150,200,250,300,400,500,600,750,1000,1250,1500,2000,2500,3000,4000,5000

[sheet]
; Survey + labels must fit inside the plan area less this margin.
margin_pct = 3
; Share of labelled courses that must be long enough on paper for their label.
min_legible_fraction = 0.9
default_family = topo
; The finished plan keeps only the chosen layout.
delete_other_layouts = true

[family.topo]
description = Surveyor's Real Property Report / topographic plan
layouts = 11X17,17X22,22X34,24X36,36X48
freeze = POINTNUMBER-*

[family.rplan]
description = Reference plan (R-plan) with parts schedule
layouts = RPLAN-11X17,RPLAN-17X22,RPLAN-22X34,RPLAN-24X36,RPLAN-36X48
freeze = POINTNUMBER-*,ELEVATION-*

