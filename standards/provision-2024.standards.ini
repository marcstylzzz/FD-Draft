[titleblock-replace]
; pattern = replacement, run over every text in the chosen layout's paper space.
; Pattern language (small enough to run in MSCAD's LISP too):
;   #  a number ("300", "7.5")     *  the rest of the text     anything else matches itself
; A pattern matches anywhere in the text, ignoring case.
; Tokens: {job.name} {job.id} {job.surveyor} {job.description} {scale}
;         {scale.denominator} {sheet} {dwg.name} {date} {date.iso} {year}
;         {paper.width} {paper.height}
JOB NUMBER:* = JOB NUMBER: {job.name}
DRAWING FILE:* = DRAWING FILE: {dwg.name}
FIELD:* = FIELD: {job.surveyor}
SCALE 1:# = SCALE {scale}
SCALE OF 1:# = SCALE OF {scale}
IS #mm IN WIDTH BY #mm IN HEIGHT = IS {paper.width}mm IN WIDTH BY {paper.height}mm IN HEIGHT

[scalebar]
; The number labels just above the "SCALE 1:300" text are recomputed for the new scale.
relabel = true
anchor = SCALE 1:#
